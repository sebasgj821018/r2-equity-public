[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-football-risk"
version = "0.1.0"
description = "Inequidad logistica como riesgo cuantificable y transferible (toolkit sintetico)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sebastian Gaviria Jaramillo"}]
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["equity_football_risk*"]
